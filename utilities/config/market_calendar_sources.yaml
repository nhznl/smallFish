# Market-event source coverage for the primary broad-market calendar.
schema_version: 1
horizon_calendar_days: 31
sources:
  bls:
    provider: bls
    required: true
    configured: true
    parser_version: bls-year-schedule-html-2
    schedule_url: https://www.bls.gov/schedule/{year}/
    freshness_hours: 192
    scope: required_bls_primary_releases
    detail: >-
      Required CPI, PPI, Employment Situation, JOLTS, and ECI rows from the
      official BLS yearly schedule tables. Unsupported BLS releases remain an
      explicit gap. The year placeholder is expanded for the requested horizon.
  bls_released_values:
    provider: bls_released_values
    required: false
    configured: false
    parser_version: bls-values-none
    scope: cpi_measurements
    detail: >-
      Not configured. The official schedule does not publish CPI actuals or
      consensus, and no released-values provider is wired in this milestone.
  federal_reserve:
    required: true
    configured: true
    parser_version: fed-calendar-json-4
    schedule_url: https://www.federalreserve.gov/json/calendar.json
    freshness_hours: 24
    scope: fomc_calendar_speeches_beige_book_industrial_production
    detail: Official Federal Reserve calendar, separate FOMC statement and press-conference occurrences, speech, Beige Book, and G.17 industrial-production schedule.
  treasury:
    required: true
    configured: true
    parser_version: treasury-tentative-auctions-xml-2
    schedule_url: https://home.treasury.gov/policy-issues/financing-the-government/quarterly-refunding/most-recent-quarterly-refunding-documents
    freshness_hours: 24
    scope: refunding_and_material_auctions
    detail: Official Treasury refunding and material auction schedule.
  bea:
    required: true
    configured: true
    parser_version: bea-calendar-ics-2
    schedule_url: https://www.bea.gov/news/schedule/ics/online-calendar-subscription.ics
    freshness_hours: 24
    scope: bea_primary_releases
    detail: Official BEA schedule for GDP, personal income, and PCE releases.
  census:
    required: true
    configured: true
    parser_version: census-calendar-html-2
    schedule_url: https://www.census.gov/economic-indicators/calendar-listview.html
    freshness_hours: 24
    scope: census_economic_indicators
    detail: Official Census schedule for retail sales, durable goods, and related indicators.
  dol_claims:
    required: true
    configured: true
    parser_version: dol-claims-publication-rule-html-2
    schedule_url: https://oui.doleta.gov/unemploy/claims_arch.asp
    freshness_hours: 168
    scope: weekly_jobless_claims
    detail: Official Department of Labor weekly unemployment-insurance claims schedule.
  finnhub_earnings:
    required: true
    configured: true
    parser_version: finnhub-calendar-sidecar-2
    freshness_hours: 24
    scope: private_local_earnings_with_dated_membership
    detail: >-
      Private local Finnhub calendar sidecar for personal use only. Fiscal
      period supplies stable identity; dated SPY/QQQ membership controls broad
      relevance. Dataset access follows the account plan; redistribution is prohibited.
  eia_petroleum:
    required: false
    configured: true
    parser_version: eia-petroleum-schedule-html-1
    schedule_url: https://www.eia.gov/petroleum/supply/weekly/schedule.php
    freshness_hours: 168
    scope: weekly_petroleum_status_schedule
    detail: Official EIA Weekly Petroleum Status Report schedule, including published holiday exceptions. Schedule metadata is separate from released values.
  eia_natural_gas:
    required: false
    configured: true
    parser_version: eia-natural-gas-schedule-html-1
    schedule_url: https://ir.eia.gov/ngs/schedule.html
    freshness_hours: 168
    scope: weekly_natural_gas_storage_schedule
    detail: Official EIA Weekly Natural Gas Storage Report schedule, including published holiday exceptions. Schedule metadata is separate from released values.
  usda_nass:
    required: false
    configured: true
    parser_version: nass-asb-ical-1
    schedule_url: https://www.nass.usda.gov/Publications/Calendar/2026/NassReleases2026.ics
    freshness_hours: 168
    scope: selected_market_sensitive_nass_reports
    detail: Official NASS Agricultural Statistics Board iCalendar, limited to Crop Production, Grain Stocks, Prospective Plantings, and Acreage.
  usda_wasde:
    required: false
    configured: true
    parser_version: usda-wasde-nass-aligned-1
    schedule_url: https://www.nass.usda.gov/Publications/Calendar/2026/NassReleases2026.ics
    freshness_hours: 168
    scope: monthly_wasde_schedule
    detail: Official USDA WASDE occurrences aligned to the same-day Crop Production entries in the NASS Agricultural Statistics Board iCalendar; released ESMIS report files remain separate from schedule metadata.
  fas_export_sales:
    required: false
    configured: true
    parser_version: fas-export-sales-esrqs-3
    schedule_url: https://apps.fas.usda.gov/esrqs/api/lookups/GetWeekEndingDates
    freshness_hours: 168
    scope: weekly_export_sales_schedule
    detail: >-
      Public official ESRQS schedule rows provide the Friday-through-Thursday
      period end and the explicit scheduled publication timestamp, including
      Friday holiday shifts and announced changes. Released values require a
      separate API.data.gov capability.
  eia_released_values:
    provider: eia_released_values
    required: false
    configured: false
    parser_version: eia-values-none
    scope: petroleum_and_natural_gas_measurements
    detail: Not configured. EIA schedule coverage is independent of released values; values require an approved EIA API key or official CSV ingestion path.
  fas_released_values:
    provider: fas_released_values
    required: false
    configured: false
    parser_version: fas-values-none
    scope: export_sales_measurements
    detail: Not configured. FAS Export Sales values require an API.data.gov key and remain separate from the public release schedule.
  private_secondary_feeds:
    provider: private_secondary_feeds
    required: false
    configured: false
    parser_version: private-secondary-none
    scope: ism_michigan_conference_board_nar
    detail: Not configured. ISM, Michigan, Conference Board, and NAR calendars are excluded pending source-terms review.
