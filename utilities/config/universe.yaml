# Manual pins. symbol: {type, notes}; every entry is pinned=true and survives
# EVERY refresh, forcing the symbol into universe.csv regardless of index
# membership.
#
# These are project defaults: small- and micro-cap names, ADRs, and recent index
# departures that no configured index source (S&P 1500 / nyse100 / nasdaq100 /
# russell1000) supplies, but that are useful to keep in the price cache and on
# the universe-only surfaces (Portfolios, Momentum). Each note states only why
# the symbol is outside the configured index universe.
#
# To pin your own symbols without editing this file, create
# `utilities/config/universe.local.yaml` (git-ignored) with the same
# `manual_pins:` structure; its entries are merged over these defaults. Keep
# personal holdings and options underlyings in that local file.
manual_pins:
  ACHR: {type: STOCK, notes: "Archer Aviation (Russell 2000, not R1000)"}
