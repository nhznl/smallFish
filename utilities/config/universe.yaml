# Behavioral configuration for utilities.universe. Registry artifact paths come
# from SFP_DATA_DIR in app.env.
wikipedia:
  sp500: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  spMidCap: "https://en.wikipedia.org/wiki/List_of_S%26P_400_companies"
  spSmallCap: "https://en.wikipedia.org/wiki/List_of_S%26P_600_companies"
  dow: "https://en.wikipedia.org/wiki/Dow_Jones_Industrial_Average"
  russell1000: "https://en.wikipedia.org/wiki/Russell_1000_Index"
russell1000:
  # Broad-market source tier: introduces mid/large-caps (and their GICS sector)
  # beyond the S&P 1500, e.g. Russell-listed retirement holdings. Non-exclusive
  # overlay with the S&P tiers -- a symbol can carry both sp500 and russell1000.
  enabled: true
nyse100:
  enabled: true
  fund_page: "https://www.globalxetfs.com/funds/nysx/"
  holdings_url_pattern: 'https://assets\.globalxetfs\.com/funds/holdings/nysx_full-holdings_\d{8}\.csv'
  user_agent: "Mozilla/5.0 (compatible; smallFish-universe/1.0)"
nasdaq100:
  enabled: true
  weighting_url: "https://indexes.nasdaqomx.com/Index/WeightingData"
  index_id: "NDX"
  user_agent: "Mozilla/5.0 (compatible; smallFish-universe/1.0)"
throttle: 0.5
validate:
  enabled: false
  limit: 200

