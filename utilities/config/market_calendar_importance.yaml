# General event importance. This is a risk classification, not a price forecast.
policy_version: "2026-10-04.1"
events:
  CPI:
    score: 5
    portfolio_relevance: DIRECT_BROAD_INDEX
    category: inflation
    asset_classes: [equities, rates]
    instruments: [SPY, QQQ]
    rule_id: importance-cpi-extreme
    rationale: >-
      CPI is a scheduled inflation release that can reprice broad equity
      indexes and interest rates. The rating does not say whether prices
      will rise or fall.
  PPI: {score: 4, portfolio_relevance: DIRECT_BROAD_INDEX, category: inflation, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-ppi-high, rationale: "Producer inflation can alter broad inflation and rate expectations without implying direction."}
  EMPLOYMENT_SITUATION: {score: 5, portfolio_relevance: DIRECT_BROAD_INDEX, category: labor, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-employment-extreme, rationale: "The employment report can cause broad repricing in growth and policy expectations."}
  JOLTS: {score: 4, portfolio_relevance: DIRECT_BROAD_INDEX, category: labor, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-jolts-high, rationale: "Labor-demand evidence can alter growth and policy expectations without predicting direction."}
  ECI: {score: 4, portfolio_relevance: DIRECT_BROAD_INDEX, category: labor, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-eci-high, rationale: "Employment costs are scheduled wage-inflation evidence relevant to broad indexes and rates."}
  JOBLESS_CLAIMS: {score: 3, portfolio_relevance: INDIRECT_BROAD_INDEX, category: labor, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-claims-moderate, rationale: "Weekly claims can affect labor-market expectations but are less concentrated than monthly reports."}
  FOMC_DECISION: {score: 5, portfolio_relevance: DIRECT_BROAD_INDEX, category: central_bank, asset_classes: [equities, rates, fx], instruments: [SPY, QQQ], rule_id: importance-fomc-extreme, rationale: "A scheduled policy decision can rapidly reprice rates and broad equity indexes in either direction."}
  FOMC_PRESS_CONFERENCE: {score: 5, portfolio_relevance: DIRECT_BROAD_INDEX, category: central_bank, asset_classes: [equities, rates, fx], instruments: [SPY, QQQ], rule_id: importance-fomc-press-conference-extreme, rationale: "A scheduled FOMC press conference can add a separate policy-communication risk window without implying market direction."}
  FOMC_MINUTES: {score: 4, portfolio_relevance: DIRECT_BROAD_INDEX, category: central_bank, asset_classes: [equities, rates, fx], instruments: [SPY, QQQ], rule_id: importance-fomc-minutes-high, rationale: "FOMC minutes can change interpretations of the policy path without implying direction."}
  FED_SPEECH: {score: 3, portfolio_relevance: INDIRECT_BROAD_INDEX, category: central_bank, asset_classes: [equities, rates, fx], instruments: [SPY, QQQ], rule_id: importance-fed-speech-moderate, rationale: "Scheduled remarks can affect policy expectations; importance remains general and non-directional."}
  BEIGE_BOOK: {score: 3, portfolio_relevance: INDIRECT_BROAD_INDEX, category: central_bank, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-beige-book-moderate, rationale: "The Beige Book is scheduled qualitative growth evidence relevant to policy expectations."}
  TREASURY_REFUNDING: {score: 4, portfolio_relevance: INDIRECT_BROAD_INDEX, category: rates, asset_classes: [rates, equities], instruments: [SPY, QQQ], rule_id: importance-refunding-high, rationale: "Refunding announcements can affect Treasury supply and discount-rate expectations."}
  TREASURY_AUCTION: {score: 3, portfolio_relevance: INDIRECT_BROAD_INDEX, category: rates, asset_classes: [rates, equities], instruments: [SPY, QQQ], rule_id: importance-auction-moderate, rationale: "Material auctions can affect rates during a defined window without a predetermined direction."}
  PCE: {score: 5, portfolio_relevance: DIRECT_BROAD_INDEX, category: inflation, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-pce-extreme, rationale: "PCE inflation is scheduled policy-relevant evidence that can reprice broad indexes and rates."}
  GDP: {score: 4, portfolio_relevance: DIRECT_BROAD_INDEX, category: growth, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-gdp-high, rationale: "GDP releases can change broad growth expectations without implying market direction."}
  RETAIL_SALES: {score: 4, portfolio_relevance: DIRECT_BROAD_INDEX, category: consumption, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-retail-high, rationale: "Retail sales are scheduled consumption evidence with broad-index relevance."}
  DURABLE_GOODS: {score: 3, portfolio_relevance: INDIRECT_BROAD_INDEX, category: growth, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-durable-moderate, rationale: "Durable-goods orders can affect growth expectations without a deterministic price implication."}
  INDUSTRIAL_PRODUCTION: {score: 3, portfolio_relevance: INDIRECT_BROAD_INDEX, category: production, asset_classes: [equities, rates], instruments: [SPY, QQQ], rule_id: importance-production-moderate, rationale: "Industrial production is scheduled growth evidence with indirect broad-index relevance."}
  EARNINGS: {score: 3, portfolio_relevance: INDIRECT_BROAD_INDEX, category: earnings, asset_classes: [equities], instruments: [SPY, QQQ], rule_id: importance-index-member-earnings, rationale: "Index membership establishes relevance, but this rule does not claim a material index weight."}
  EIA_PETROLEUM_STATUS: {score: 3, portfolio_relevance: SECTOR_OR_COMMODITY, category: energy, asset_classes: [commodities, equities], instruments: [USO, XLE, XOP], rule_id: importance-eia-petroleum-moderate, rationale: "Weekly petroleum inventory evidence can reprice oil and energy-sector instruments without implying direction."}
  EIA_NATURAL_GAS_STORAGE: {score: 3, portfolio_relevance: SECTOR_OR_COMMODITY, category: energy, asset_classes: [commodities, equities], instruments: [UNG, XLE, XOP], rule_id: importance-eia-natural-gas-moderate, rationale: "Weekly storage evidence can reprice natural-gas and energy-sector instruments without implying direction."}
  USDA_WASDE: {score: 4, portfolio_relevance: SECTOR_OR_COMMODITY, category: agriculture, asset_classes: [commodities, equities], instruments: [DBA, MOO], rule_id: importance-usda-wasde-high, rationale: "WASDE is scheduled supply-and-demand evidence for agricultural commodities and related equities without a predetermined price implication."}
  USDA_CROP_PRODUCTION: {score: 4, portfolio_relevance: SECTOR_OR_COMMODITY, category: agriculture, asset_classes: [commodities, equities], instruments: [DBA, MOO], rule_id: importance-usda-crop-production-high, rationale: "Crop Production reports can change agricultural supply evidence without implying direction."}
  USDA_GRAIN_STOCKS: {score: 4, portfolio_relevance: SECTOR_OR_COMMODITY, category: agriculture, asset_classes: [commodities, equities], instruments: [DBA, MOO], rule_id: importance-usda-grain-stocks-high, rationale: "Grain Stocks reports can change agricultural supply evidence without implying direction."}
  USDA_PROSPECTIVE_PLANTINGS: {score: 4, portfolio_relevance: SECTOR_OR_COMMODITY, category: agriculture, asset_classes: [commodities, equities], instruments: [DBA, MOO], rule_id: importance-usda-prospective-plantings-high, rationale: "Prospective Plantings is scheduled acreage evidence that does not determine a market response."}
  USDA_ACREAGE: {score: 4, portfolio_relevance: SECTOR_OR_COMMODITY, category: agriculture, asset_classes: [commodities, equities], instruments: [DBA, MOO], rule_id: importance-usda-acreage-high, rationale: "Acreage is scheduled crop-area evidence that does not determine a market response."}
  FAS_EXPORT_SALES: {score: 3, portfolio_relevance: SECTOR_OR_COMMODITY, category: agriculture, asset_classes: [commodities, equities], instruments: [DBA, MOO], rule_id: importance-fas-export-sales-moderate, rationale: "Weekly export-sales evidence can affect agricultural demand expectations without implying direction."}
