# Behavioral settings for utilities.options.wheel. Cache and artifact paths come from app.env.
horizons_dte: [7, 14, 30, 37, 45]
cushions_pct: [2.5, 5, 7.5, 10]
itm_frequency_target: 0.20
rv_window_by_dte: { 7: 7, 14: 21, 30: 21, 37: 21, 45: 37 }
rv_percentile_lookback: 252
rv_percentile_min_lookback: 60
universe:
  use_latest_strategy_report: true
  strategy_report: pre_earnings_momentum
discontinuity_abs_log_return: 0.30
min_clean_sessions: 300
quality:
  # Fail closed: the latest underlying bar must match the latest validated SPY
  # session on/before the run's as-of date.
  underlying_max_stale_sessions: 0
