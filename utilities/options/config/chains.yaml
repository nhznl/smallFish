# Behavioral settings for utilities.options.chains. Artifact paths come from app.env.
chain_dtes: [7, 14, 30, 37, 45]
# The weekly target remains exact. The 14-, 30-, and 45-DTE targets accept the
# nearest standard listed expiry within ±4 calendar days. The 37-DTE target
# accepts an actual listed expiry within ±9 calendar days (28–46 DTE), approved
# 2026-07-24.
expiry_tolerance_days:
  7: 0
  14: 4
  30: 4
  37: 9
  45: 4
min_dollar_volume: 10000000
# Horizon-independent symbols are fetched first; eligibility and rank caps are
# then applied independently after each listed expiry is discovered.
fetch_pool_n: 60
per_expiry_top_n: 60
actual_expiry_context:
  # Explicit step-function mapping; no interpolation or nearest-horizon context.
  rv_window_by_max_dte:
    10: 7
    40: 21
    365: 37
# K2 strategy-specific selectors. Entry strikes are strictly OTM. ITM strikes
# are archived in a separate roll/exit view and never enter ranking.
strike_policy:
  put_entry:
    band_mult: 1.0
    extra_strikes_beyond_band: 3
  call_entry:
    band_mult: 1.0
    extra_strikes_beyond_band: 3
  roll_exit:
    max_itm_strikes_per_side: 3
oi_min: 100
max_spread_pct: 0.10
# Exact candidate contracts are enriched from Tastytrade's DXLink Quote stream.
# Yahoo remains the contract-discovery/OI source and a diagnostic-only quote
# fallback because it does not expose its bid/ask observation timestamp.
quote_provider:
  primary: TASTYTRADE_DXLINK
  timeout_seconds: 8
  batch_size: 400
# Bid/ask observations must carry their own provider timestamp. Retrieval time
# is never substituted. The 20-minute RTH limit accommodates the provider's
# documented ~15-minute delay while still failing closed on unknown/old quotes.
quote_quality:
  max_age_seconds: 1200
  future_tolerance_seconds: 60
  negative_extrinsic_tolerance: 0.01
  require_rth: true
execution:
  # Conservative seller baseline. Midpoint remains a sensitivity diagnostic.
  seller_fill_method: BID
throttle_sleep: 0.5
exclude_earnings_in_window: false
