# Equal-arm low-fee post-earnings development variant: Risk-On entries only.
study_id: pre-earnings-post-event-hold-low-fee-risk-on-v1
setup_score_version: momentum-v3
phase: development
benchmark_symbol: SPY
starting_equity: 50000
cost_model: per_share
cost_per_share: 0.0008
price_min: 10.0
price_max: 500.0
event_min_weeks: 2
event_max_weeks: 5
max_stale_sessions: 3
required_setup: BULLISH_CONTINUATION
setup_score_min_exclusive: 50.0
max_candidates_per_sector_report: 10
max_open_pending_per_sector: 3
min_position_target: 1000.0
max_position_principal: 5000.0
entry_limit_buffer_pct: 0.03
pin_calendar_days: 30
warmup_calendar_years: 1
entry_scan_schedule: daily
cash_staging_enabled: true
exit_policy: post_event_hold
market_regime_gate: risk_on
post_event_hold_sessions: 7
market_regime:
  sma_window: 50
  slope_sessions: 5
arms:
  - equal
liquidity:
  min_avg_volume: 4000000
  min_avg_dollar_volume: 10000000
drawdown:
  principal_low: 1000.0
  principal_high: 5000.0
  decline_at_low: 0.20
  decline_at_high: 0.10
output:
  relative_root: backtest/pre_earnings_momentum/post_earnings_hold_low_fee/risk_on
