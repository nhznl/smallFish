# Frozen configuration for utilities/sector_rotation_study.py.
# Protocol: utilities/sector_rotation_study_spec.md, frozen 2026-07-26 before
# any pre-2020 sector ETF outcomes were loaded into the repository cache.
schema_name: smallfish.sector-rotation-study
schema_version: 1
study_id: legacy-nine-v1

benchmark: SPY
universe: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY]
excluded_product_sectors: [XLC, XLRE]

feature_windows: [5, 20, 63]
forward_sessions: 63
decision_stride_sessions: 63
volume_baseline_sessions: 20
leading_rank_max: 3
lagging_rank_min: 7
min_windows_confirmed: 1
# 9 * 8 ordered pairs: retain every qualifying candidate, never a top-N sweep.
