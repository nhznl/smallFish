name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Never paste a credential, a real account number, or real position
        data.** `./commands.sh doctor` output is safe — it masks secrets and
        reports counts and paths, not contents.

        For a security problem, do not use this form. See
        [SECURITY.md](https://github.com/nhznl/smallFish/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ./commands.sh bootstrap-data
        2. ./commands.sh server --no-reload
        3. Open http://127.0.0.1:8000/momentum
        4. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: ./commands.sh doctor output
      description: Paste the full output. It is already redacted.
      render: text
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: >-
        The full error or traceback, with any absolute paths and identifiers
        redacted.
      render: text

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup (setup.sh, doctor)
        - Data (bootstrap-data, scraper, universe)
        - API (FastAPI backend)
        - UI (Angular dashboard)
        - Brokerage integration
        - Research Studies
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no credential, real account identifier, or real position data
          required: true
